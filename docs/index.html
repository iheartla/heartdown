<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>H❤️rtDown Editor</title>
    <link href="./css/bootstrap@5.1.2.min.css" rel="stylesheet">
    <script src="./js/bootstrap@5.1.2.bundle.min.js"></script>
    <link rel="stylesheet" href="./fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <script>
        MathJax = {
          tex: {
           inlineMath: [['$', '$']]
           },
           options: {
            enableAssistiveMml: false
          },
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="./js/src-noconflict/ace.js" type="text/javascript" charset="utf-8"></script>
    <script src="./js/src-noconflict/ext-language_tools.js"></script>
    <script src="./js/angular.js"></script>
    <script type="text/javascript" src='./js/project.js'></script>
    <script type="text/javascript" src='./js/editor.js'></script>
    <script>
        window.onload = onLoad;
    </script>
    <script src="./js/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="container-fluid vh-100 d-flex flex-column">
    <div class="row align-items-center">
        <div class="col-auto">
            <h1 style="margin-top: 1ex;">H❤️rtDown Editor</h1>
        </div>
        <div class="col toolbar">
            <button id="openFolder" class="btn btn-outline-secondary btn-sm" onclick="clickOpenFolder()" title="Open a paper's folder on your computer. Compiling saves the paper and the generated files there." hidden><i class="fa fa-folder-open"></i> Open folder</button>
            <button id="reopenFolder" class="btn btn-outline-secondary btn-sm" onclick="clickReopenFolder()" hidden></button>
            <label class="btn btn-outline-secondary btn-sm mb-0" title="Open a paper and the files it uses (.bib, .ihla, images) into this browser"><i class="fa fa-file-o"></i> Open files
                <input type="file" multiple hidden onchange="onOpenFiles(this)"></label>
            <label class="btn btn-outline-secondary btn-sm mb-0" title="Copy a paper's folder into this browser"><i class="fa fa-folder-o"></i> Import folder
                <input type="file" webkitdirectory hidden onchange="onOpenFiles(this)"></label>
            <button class="btn btn-outline-secondary btn-sm" onclick="clickOpenURL()" title="Open a paper (.md or .txt) or a zip of its folder from a URL, into this browser. A link to the editor with ?paper=<url> does the same."><i class="fa fa-link"></i> Open URL</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="clickNew()" title="Start a new paper in this browser"><i class="fa fa-plus"></i> New</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="clickSave()" title="Save the paper (Ctrl/⌘-S)"><i class="fa fa-floppy-o"></i> Save</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="clickDownloadPaper()" title="Download the paper (.md)"><i class="fa fa-download"></i> Paper</button>
            <div class="btn-group">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" title="Download the paper's code, as generated by compiling (and by the command line)"><i class="fa fa-code"></i> Code</button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="clickDownloadCode('lib.py'); return false;">Python (NumPy): lib.py</a></li>
                    <li><a class="dropdown-item" href="#" onclick="clickDownloadCode('lib.h'); return false;">C++ (Eigen): lib.h</a></li>
                    <li><a class="dropdown-item" href="#" onclick="clickDownloadCode('lib.m'); return false;">MATLAB: lib.m</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#" onclick="clickDownloadCode(); return false;">All three (zip)</a></li>
                </ul>
            </div>
            <button class="btn btn-outline-secondary btn-sm" onclick="clickDownloadZip()" title="Download the paper's folder, with the generated HTML and code, as a zip"><i class="fa fa-file-archive-o"></i> Zip</button>
            <span id="projectInfo" class="ms-2 small"></span>
        </div>
    </div>
    <div class="row flex-grow-1" style="margin: 0 0 1.5em 0;">
    
        <!-- A column for the code editor and buttons -->
        <div class="col-lg">
<!--            <div>-->
<!--                <div class="col-sm">-->
                    <pre id="editor">
                    </pre>
<!--                </div>-->
<!--            </div>-->
        <!-- Close the code editor and widgets column -->
        </div>
    
    <!-- The MathJax output column -->
        <div class="col-lg">
            <div id="output"></div>
        </div>
    <!-- Close the row containing the code editor and MathJax output -->
    </div>


</div>

    <!-- The buttons row -->
<nav class="navbar fixed-bottom navbar-light widgets">
  <div class="container flex-column-reverse justify-content-center">
    <div class="compileCol">
            <button id="compile" class="btn btn-success shadow" onclick="clickCompile()">
                <i id="submit_icon" class="fa fa-refresh"></i> Compile
            <!--  <i id="submit_icon" class="fa fa-refresh fa-spin"></i> Compile-->
            </button>
        </div>
        <div class="msgCol">
<!--            <pre>-->
                <div id="msg" class="alert alert-primary shadow" role="alert" hidden></div>
<!--            </pre>-->
    </div>
  </div>
</nav>

<!--<button type="button"  data-bs-toggle="modal" data-bs-target="#eqEditor">-->
<!--</button>-->

<!-- iheartla Modal -->
<div class="modal fade" id="eqEditor" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="staticBackdropLabel">Update I❤️LA equation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="onCancelUpdateEq()"></button>
      </div>
      <div class="modal-body">
        <pre id="equation">

        </pre>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="onCancelUpdateEq()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="onUpdateEq()">Update</button>
      </div>
    </div>
  </div>
</div>

<!-- Python Modal -->
<div class="modal fade" id="testEditor" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="staticBackdropLabel1">Update figure code</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="onCancelUpdatePython()"></button>
      </div>
      <div class="modal-body">
        <pre id="python">

        </pre>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="onCancelUpdatePython()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="onUpdatePython()">Update</button>
      </div>
    </div>
  </div>
</div>

<!-- Choose the paper in a folder -->
<div class="modal fade" id="choosePaper" tabindex="-1" aria-labelledby="choosePaperLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="choosePaperLabel">Which paper?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="paperList" class="list-group"></div>
      </div>
    </div>
  </div>
</div>

<!-- Loading Modal -->
<div class="modal fade bd-example-modal-lg" id="loading" data-backdrop="static" data-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content" style="width: 48px">
            <span class="fa fa-spinner fa-spin fa-3x"></span>
        </div>
    </div>
</div>

</body>

<script>
    // initPyodide()
    // const [ validBrowser, validBrowserMessage ] = checkBrowserVer();
    // showMsg( validBrowserMessage, !validBrowser );
    // initBtnStatus();
    //
    let editor = ace.edit("editor");
    // editor.setTheme("ace/theme/chaos");
    editor.setTheme("ace/theme/chalkboard");
    editor.session.setMode("ace/mode/markdown");
    editor.session.on('change', onEditIhla);
    editor.getSession().setUseWrapMode(true);
    editor.setOptions({
        enableBasicAutocompletion: true,
        enableLiveAutocompletion: true,
        // maxLines: 100,
        // minLines: 20
    });
    editor.setShowPrintMargin(false);

    let equation = ace.edit("equation");
    equation.setTheme("ace/theme/chalkboard");
    equation.session.setMode("ace/mode/iheartla");
    equation.session.on('change', onEditIhla);
    equation.getSession().setUseWrapMode(true);
    equation.setOptions({
        enableBasicAutocompletion: true,
        enableLiveAutocompletion: true,
        maxLines: 20,
        minLines: 20
    });

    // comments are easier to read in tomorrow_night than twilight
    let theme = "ace/theme/tomorrow_night";
    // let cpp = ace.edit("cpp");
    // cpp.setTheme(theme);
    // cpp.session.setMode("ace/mode/c_cpp");
    // cpp.setOptions({
    //     readOnly: true,
    // });
    //
    let python = ace.edit("python");
    python.setTheme(theme);
    python.session.setMode("ace/mode/python");
    python.setOptions({
        enableBasicAutocompletion: true,
        enableLiveAutocompletion: true,
        maxLines: 20,
        minLines: 20
    });
    //
    // let test = ace.edit("test");
    // test.setTheme(theme);
    // test.session.setMode("ace/mode/python");
    // test.setOptions({
    //     readOnly: false,
    // });
    //
    // let matlab = ace.edit("matlab");
    // matlab.setTheme(theme);
    // matlab.session.setMode("ace/mode/matlab");
    // matlab.setOptions({
    //     readOnly: true,
    // });

    $('#keybinding input').click(function() {
        if (this.id == 'ace'){
            editor.setKeyboardHandler("ace/keyboard/keybinding");
            equation.setKeyboardHandler("ace/keyboard/keybinding");
            python.setKeyboardHandler("ace/keyboard/keybinding");
        }
        else{
            editor.setKeyboardHandler("ace/keyboard/"+this.id);
            equation.setKeyboardHandler("ace/keyboard/"+this.id);
            python.setKeyboardHandler("ace/keyboard/"+this.id);
        }
    });
    captureHotKeys();
</script>


</html>
