[project]
name = "heartdown"
version = "0.1.0"
description = "H❤️rtDown: document processor for executable linear algebra papers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # the I❤️LA compiler and H❤️rtDown's fork of Python-Markdown (submodules in deps/; see [tool.uv.sources])
    "iheartla",
    "markdown",
    "pybtex",
    "pyyaml",
    # for figure code and the generated lib.py
    "numpy",
    "scipy",
    "matplotlib",
]

[project.scripts]
heartdown = "heartdown.app:main"
heartdown-server = "heartdown.server:main"

[dependency-groups]
dev = ["pytest"]
# for tests/test_browser.py, with Google Chrome
browser = ["playwright"]

[project.urls]
Homepage = "https://github.com/iheartla/heartdown"

[tool.uv.sources]
iheartla = { path = "deps/iheartla", editable = true }
markdown = { path = "deps/markdown", editable = true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The repository root is the heartdown package, with the resources that app.py and
# server.py find next to them
[tool.setuptools]
packages = ["heartdown"]
package-dir = { heartdown = "." }

[tool.setuptools.package-data]
heartdown = ["extras/heartdown-resource/**/*", "docs/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
